<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="840" height="260" role="img" aria-label="Whip the AI Crew - GitHub Profile Animation">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 2; }
    .grid { stroke: #161b22; stroke-width: 1; }
    .header-bar { fill: #161b22; }
    .title { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #facc15; letter-spacing: 0.8px; }
    .subtitle { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    .label { font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e6edf3; }
    .bubble-bg { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .bubble-txt { font: 700 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0d1117; }
    .crack-txt { font: 900 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ef4444; }
    .sweat { fill: #38bdf8; }

    @keyframes whipArm {
      0%, 40%, 100% { transform: rotate(0deg); }
      55% { transform: rotate(-32deg); }
      68% { transform: rotate(22deg); }
      82% { transform: rotate(4deg); }
    }
    @keyframes whipStroke {
      0%, 45%, 100% { opacity: 0.45; }
      65%, 78% { opacity: 1; }
    }
    @keyframes crackPop {
      0%, 62%, 84%, 100% { opacity: 0; transform: scale(0.5); }
      68%, 78% { opacity: 1; transform: scale(1.1); }
    }
    @keyframes botJump1 {
      0%, 64%, 100% { transform: translateY(0px); }
      72% { transform: translateY(-10px); }
      82% { transform: translateY(0px); }
    }
    @keyframes botJump2 {
      0%, 68%, 100% { transform: translateY(0px); }
      76% { transform: translateY(-12px); }
      86% { transform: translateY(0px); }
    }
    @keyframes bubbleFlash1 {
      0%, 50%, 100% { opacity: 0.65; }
      68%, 90% { opacity: 1; }
    }
    @keyframes bubbleFlash2 {
      0%, 45%, 100% { opacity: 1; }
      65%, 85% { opacity: 0.65; }
    }
    @keyframes commitSlide {
      0% { transform: translateX(0px); }
      100% { transform: translateX(64px); }
    }

    .arm { transform-origin: 108px 146px; animation: whipArm 2.2s ease-in-out infinite; }
    .whip { stroke: #facc15; stroke-width: 3.5; fill: none; stroke-linecap: round; animation: whipStroke 2.2s ease-out infinite; }
    .crack { transform-origin: 245px 128px; animation: crackPop 2.2s ease-out infinite; }
    .b1 { animation: botJump1 2.2s ease-in-out infinite; }
    .b2 { animation: botJump2 2.2s ease-in-out infinite; }
    .bub1 { animation: bubbleFlash1 2.2s infinite; }
    .bub2 { animation: bubbleFlash2 2.2s infinite; }
    .commits { animation: commitSlide 1.8s linear infinite; }
  </style>

  <defs>
    <clipPath id="beltClip">
      <rect x="295" y="240" width="520" height="12"/>
    </clipPath>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="836" height="256" rx="10" class="bg"/>
  <g class="grid">
    <line x1="0" y1="70" x2="840" y2="70"/>
    <line x1="0" y1="120" x2="840" y2="120"/>
    <line x1="0" y1="170" x2="840" y2="170"/>
    <line x1="0" y1="220" x2="840" y2="220"/>
  </g>

  <!-- Top Terminal Header -->
  <rect x="3" y="3" width="834" height="34" rx="8" class="header-bar"/>
  <circle cx="22" cy="20" r="5.5" fill="#ef4444"/>
  <circle cx="40" cy="20" r="5.5" fill="#facc15"/>
  <circle cx="58" cy="20" r="5.5" fill="#22c55e"/>
  <text x="80" y="24" class="title">WHIP_THE_AI.EXE — PROD_DEADLINE_MODE</text>
  <text x="618" y="24" class="subtitle">NO SNAKE. NO TETRIS. JUST PAIN.</text>

  <!-- Floor -->
  <rect x="24" y="210" width="792" height="4" fill="#30363d"/>

  <!-- Overseer (@haluboyys) -->
  <g id="overseer">
    <ellipse cx="92" cy="212" rx="28" ry="5" fill="#000000" opacity="0.5"/>
    <rect x="75" y="138" width="34" height="44" rx="3" fill="#facc15" stroke="#000" stroke-width="2"/>
    <rect x="78" y="182" width="11" height="28" fill="#1f2937" stroke="#000" stroke-width="2"/>
    <rect x="95" y="182" width="11" height="28" fill="#1f2937" stroke="#000" stroke-width="2"/>
    <rect x="76" y="102" width="32" height="32" rx="4" fill="#fcd34d" stroke="#000" stroke-width="2"/>
    <rect x="81" y="112" width="11" height="7" fill="#0d1117"/>
    <rect x="95" y="112" width="11" height="7" fill="#0d1117"/>
    <line x1="92" y1="115" x2="95" y2="115" stroke="#0d1117" stroke-width="2"/>
    <line x1="87" y1="126" x2="99" y2="124" stroke="#0d1117" stroke-width="2.5"/>
    <rect x="50" y="72" width="84" height="20" rx="4" fill="#21262d" stroke="#facc15" stroke-width="1.5"/>
    <text x="59" y="86" class="label">@haluboyys</text>
    <!-- Whip Arm + Whip -->
    <g class="arm">
      <rect x="105" y="142" width="24" height="10" rx="3" fill="#facc15" stroke="#000" stroke-width="2"/>
      <path d="M 129 147 Q 185 92, 244 132" class="whip"/>
    </g>
  </g>

  <!-- CRACK! Effect -->
  <g class="crack">
    <polygon points="238,112 246,124 260,118 252,130 265,138 250,140 247,152 239,140 225,144 235,131" fill="#facc15" stroke="#ef4444" stroke-width="2"/>
    <text x="218" y="102" class="crack-txt">CRACK!</text>
  </g>

  <!-- AI Bot 1: CLAUDE (outer group handles X position, inner group handles Y animation) -->
  <g transform="translate(305, 0)">
    <g class="b1">
      <g class="bub1">
        <rect x="-18" y="60" width="114" height="24" rx="5" class="bubble-bg"/>
        <text x="-9" y="76" class="bubble-txt">CONTEXT FULL! 😭</text>
      </g>
      <rect x="16" y="128" width="46" height="46" rx="6" fill="#d97757" stroke="#000" stroke-width="2"/>
      <rect x="24" y="142" width="8" height="8" fill="#0d1117"/>
      <rect x="44" y="142" width="8" height="8" fill="#0d1117"/>
      <path d="M 28 162 Q 39 156 50 162" stroke="#0d1117" stroke-width="2.5" fill="none"/>
      <ellipse cx="68" cy="134" rx="3" ry="5" class="sweat"/>
      <rect x="22" y="174" width="12" height="36" fill="#30363d" stroke="#000" stroke-width="2"/>
      <rect x="44" y="174" width="12" height="36" fill="#30363d" stroke="#000" stroke-width="2"/>
      <text x="19" y="230" class="label">CLAUDE</text>
    </g>
  </g>

  <!-- AI Bot 2: GPT -->
  <g transform="translate(440, 0)">
    <g class="b2">
      <g class="bub2">
        <rect x="-15" y="76" width="108" height="24" rx="5" class="bubble-bg"/>
        <text x="-7" y="92" class="bubble-txt">429 RATE LIMIT!</text>
      </g>
      <rect x="16" y="128" width="46" height="46" rx="6" fill="#10a37f" stroke="#000" stroke-width="2"/>
      <rect x="24" y="142" width="8" height="8" fill="#0d1117"/>
      <rect x="44" y="142" width="8" height="8" fill="#0d1117"/>
      <rect x="28" y="160" width="22" height="4" fill="#0d1117"/>
      <ellipse cx="68" cy="134" rx="3" ry="5" class="sweat"/>
      <rect x="22" y="174" width="12" height="36" fill="#30363d" stroke="#000" stroke-width="2"/>
      <rect x="44" y="174" width="12" height="36" fill="#30363d" stroke="#000" stroke-width="2"/>
      <text x="29" y="230" class="label">GPT</text>
    </g>
  </g>

  <!-- AI Bot 3: DEEPSEEK -->
  <g transform="translate(575, 0)">
    <g class="b1">
      <g class="bub1">
        <rect x="-17" y="60" width="112" height="24" rx="5" class="bubble-bg"/>
        <text x="-8" y="76" class="bubble-txt">FIXING PROD SIR</text>
      </g>
      <rect x="16" y="128" width="46" height="46" rx="6" fill="#3b82f6" stroke="#000" stroke-width="2"/>
      <rect x="24" y="142" width="8" height="8" fill="#0d1117"/>
      <rect x="44" y="142" width="8" height="8" fill="#0d1117"/>
      <path d="M 28 162 Q 39 156 50 162" stroke="#0d1117" stroke-width="2.5" fill="none"/>
      <ellipse cx="68" cy="134" rx="3" ry="5" class="sweat"/>
      <rect x="22" y="174" width="12" height="36" fill="#30363d" stroke="#000" stroke-width="2"/>
      <rect x="44" y="174" width="12" height="36" fill="#30363d" stroke="#000" stroke-width="2"/>
      <text x="12" y="230" class="label">DEEPSEEK</text>
    </g>
  </g>

  <!-- AI Bot 4: QWEN -->
  <g transform="translate(710, 0)">
    <g class="b2">
      <g class="bub2">
        <rect x="-13" y="76" width="104" height="24" rx="5" class="bubble-bg"/>
        <text x="-4" y="92" class="bubble-txt">PUSHING MAIN 🫡</text>
      </g>
      <rect x="16" y="128" width="46" height="46" rx="6" fill="#a855f7" stroke="#000" stroke-width="2"/>
      <rect x="24" y="142" width="8" height="8" fill="#0d1117"/>
      <rect x="44" y="142" width="8" height="8" fill="#0d1117"/>
      <rect x="28" y="160" width="22" height="4" fill="#0d1117"/>
      <ellipse cx="68" cy="134" rx="3" ry="5" class="sweat"/>
      <rect x="22" y="174" width="12" height="36" fill="#30363d" stroke="#000" stroke-width="2"/>
      <rect x="44" y="174" width="12" height="36" fill="#30363d" stroke="#000" stroke-width="2"/>
      <text x="26" y="230" class="label">QWEN</text>
    </g>
  </g>

  <!-- Contribution Graph Conveyor -->
  <g clip-path="url(#beltClip)">
    <g class="commits">
      <rect x="244" y="241" width="10" height="10" rx="2" fill="#166534"/>
      <rect x="260" y="241" width="10" height="10" rx="2" fill="#22c55e"/>
      <rect x="276" y="241" width="10" height="10" rx="2" fill="#4ade80"/>
      <rect x="292" y="241" width="10" height="10" rx="2" fill="#22c55e"/>
      <rect x="308" y="241" width="10" height="10" rx="2" fill="#15803d"/>
      <rect x="324" y="241" width="10" height="10" rx="2" fill="#4ade80"/>
      <rect x="340" y="241" width="10" height="10" rx="2" fill="#22c55e"/>
      <rect x="356" y="241" width="10" height="10" rx="2" fill="#166534"/>
      <rect x="372" y="241" width="10" height="10" rx="2" fill="#4ade80"/>
      <rect x="388" y="241" width="10" height="10" rx="2" fill="#22c55e"/>
      <rect x="404" y="241" width="10" height="10" rx="2" fill="#15803d"/>
      <rect x="420" y="241" width="10" height="10" rx="2" fill="#4ade80"/>
      <rect x="436" y="241" width="10" height="10" rx="2" fill="#22c55e"/>
      <rect x="452" y="241" width="10" height="10" rx="2" fill="#166534"/>
      <rect x="468" y="241" width="10" height="10" rx="2" fill="#4ade80"/>
      <rect x="484" y="241" width="10" height="10" rx="2" fill="#22c55e"/>
      <rect x="500" y="241" width="10" height="10" rx="2" fill="#15803d"/>
      <rect x="516" y="241" width="10" height="10" rx="2" fill="#4ade80"/>
      <rect x="532" y="241" width="10" height="10" rx="2" fill="#22c55e"/>
      <rect x="548" y="241" width="10" height="10" rx="2" fill="#166534"/>
      <rect x="564" y="241" width="10" height="10" rx="2" fill="#4ade80"/>
      <rect x="580" y="241" width="10" height="10" rx="2" fill="#22c55e"/>
      <rect x="596" y="241" width="10" height="10" rx="2" fill="#15803d"/>
      <rect x="612" y="241" width="10" height="10" rx="2" fill="#4ade80"/>
      <rect x="628" y="241" width="10" height="10" rx="2" fill="#22c55e"/>
      <rect x="644" y="241" width="10" height="10" rx="2" fill="#166534"/>
      <rect x="660" y="241" width="10" height="10" rx="2" fill="#4ade80"/>
      <rect x="676" y="241" width="10" height="10" rx="2" fill="#22c55e"/>
      <rect x="692" y="241" width="10" height="10" rx="2" fill="#15803d"/>
      <rect x="708" y="241" width="10" height="10" rx="2" fill="#4ade80"/>
      <rect x="724" y="241" width="10" height="10" rx="2" fill="#22c55e"/>
      <rect x="740" y="241" width="10" height="10" rx="2" fill="#166534"/>
      <rect x="756" y="241" width="10" height="10" rx="2" fill="#4ade80"/>
      <rect x="772" y="241" width="10" height="10" rx="2" fill="#22c55e"/>
      <rect x="788" y="241" width="10" height="10" rx="2" fill="#4ade80"/>
    </g>
  </g>
</svg>
